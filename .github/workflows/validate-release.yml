name: Validate shared release engine
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash -n release/scripts/intelligent-release.sh
      - run: python3 -m unittest discover -s release/scripts -p 'test_*.py'
      - run: jq empty release/presets/release-impact.json
